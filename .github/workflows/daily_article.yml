name: Publicación Diaria Automatizada (07:00 AM ART)

on:
  schedule:
    # 07:00 AM hora argentina (UTC-3) -> 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar_articulo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install requests pypdf python-docx python-dotenv

      - name: Generar Artículo del Día con Gemini & Search Grounding
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_daily_article.py

      - name: Actualizar Base de Conocimiento RAG
        run: |
          python -c "
          from ingestion import sync_repository
          sync_repository()
          " || python cloud_ingestion.py || true

      - name: Commit y Push a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Repo/ knowledge_base.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Nuevo artículo diario de seguros" && git push)
