name: Cloud Auto-Sync (Google Drive -> GitHub)

on:
  repository_dispatch:
    types: [drive_sync]
  schedule:
    # 4 veces al d?a: 00:00, 06:00, 12:00, 18:00 hora de Argentina (03:00, 09:00, 15:00, 21:00 UTC)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install requests pypdf python-dotenv

      - name: Ejecutar Indexaci?n en la Nube
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python cloud_ingestion.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add knowledge_base.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Sync: Actualizar base de conocimiento desde Google Drive" && git push)
